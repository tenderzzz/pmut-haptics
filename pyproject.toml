[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pmut-haptics"
version = "0.2.0"
description = "Reproducible pMUT airborne haptic field and stimulus simulation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.1", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
demo = ["streamlit>=1.65", "plotly>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "threadpoolctl>=3.5", "build>=1.2"]

[project.scripts]
pmut-haptics = "pmut_haptics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmut_haptics"]

[tool.hatch.build.targets.sdist]
include = ["/web", "/pmut-haptics.html", "/src", "/tests", "/configs", "/scripts", "/docs", "/README.md", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/.github", "/.gitignore", "/.streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
